<div style="padding: 30px; background-color: #f4f7f6; min-height: calc(100vh - 60px);">
  <div style="margin-bottom: 25px;">
    <h2 style="margin: 0; font-size: 22px; color: #1a1a1a;">Timeline de Auditoría</h2>
    <p style="color: #666; font-size: 14px; margin-top: 5px;">Registro inmutable de eventos de negocio</p>
    
    <!-- Barra de Filtros (Exigencia del caso) -->
    <div style="display: flex; gap: 15px; background: white; padding: 15px; border-radius: 8px; border: 1px solid #e1e4e8; margin-top: 20px;">
      <input type="text" [(ngModel)]="filtroUsuario" placeholder="Filtrar por Actor (ej. SYSTEM)..." style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      <input type="date" [(ngModel)]="filtroFecha" style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      <input type="text" [(ngModel)]="filtroTipo" placeholder="Tipo de Evento..." style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
    </div>
  </div>

  <div style="background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
    
    <!-- Contenedor principal de la línea de tiempo iterando eventosFiltrados -->
    <div *ngIf="eventosFiltrados && eventosFiltrados.length > 0; else emptyState">
      <div *ngFor="let log of eventosFiltrados" style="display: flex; gap: 20px; margin-bottom: 30px; position: relative;">
        
        <!-- Línea conectora -->
        <div style="width: 2px; background: #e1e4e8; position: absolute; left: 14px; top: 30px; bottom: -30px;"></div>
        
        <!-- Círculo -->
        <div style="width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2; background: #f0f7ff; border: 2px solid #0366d6;"></div>
        
        <!-- Datos del Evento -->
        <div style="flex: 1; background: white; z-index: 1;">
          <span style="font-size: 12px; color: #666; font-family: monospace;">
            {{ log.timestamp | date:'yyyy-MM-dd HH:mm:ss' }} | {{ log.actor }}
          </span>
          
          <h4 style="margin: 5px 0; font-size: 15px; color: #24292e;">
            {{ log.eventType || 'Cambio de Estado Procesado' }}
          </h4>
          
          <div style="margin: 5px 0 0 0; font-size: 13px; color: #586069; background: #f6f8fa; padding: 15px; border-radius: 4px; overflow-x: auto;">
            <!-- Renderizamos el JSON crudo de forma segura -->
            <pre style="margin: 0; font-family: monospace; white-space: pre-wrap;">{{ log.payload }}</pre>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado vacío seguro cuando no hay resultados de la API o del Filtro -->
    <ng-template #emptyState>
      <div style="text-align: center; color: #6a737d; font-style: italic; padding: 20px;">
        No se encontraron eventos o los filtros aplicados no coinciden con ningún registro.
      </div>
    </ng-template>

  </div>
</div>
