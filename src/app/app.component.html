<!-- Vista Pública: Solo carga el Router (Login) si no hay sesión -->
<ng-container *ngIf="!isLoggedIn">
  <router-outlet></router-outlet>
</ng-container>

<!-- Vista Privada: Estructura corporativa mostrada tras el login -->
<div *ngIf="isLoggedIn" class="app-layout">
  
  <!-- Sidebar de Navegación -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">⬡</span> Pedidos360
    </div>
    
    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active-link" class="nav-link">Panel General</a>
      <a routerLink="/orders" routerLinkActive="active-link" class="nav-link">Gestión de Pedidos</a>
      <a routerLink="/catalog" routerLinkActive="active-link" class="nav-link">Catálogo de Productos</a>
      <a routerLink="/reports" routerLinkActive="active-link" class="nav-link">Reportería</a>
      <a routerLink="/audit" routerLinkActive="active-link" class="nav-link">Auditoría (Timeline)</a>
    </nav>
  </aside>

  <!-- Área Principal -->
  <div class="main-wrapper">
    <!-- Header Superior -->
    <header class="top-header">
      <div class="header-status">
        <span class="status-dot"></span> Sesión activa (MSAL)
      </div>
      <button class="logout-btn" (click)="logout()">Cerrar Sesión</button>
    </header>

    <!-- Contenedor Dinámico: Aquí se inyectan el Dashboard, Catálogo, etc. -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
